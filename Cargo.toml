[package]
name = "daylight-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
wayland-lite = { path = "crates/wayland-lite" }
lean-mmap = { path = "crates/lean-mmap" }
rustix = { version = "=1.1.6", default-features = false, features = ["alloc", "event", "fs", "mm", "net", "runtime", "stdio", "time"] }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
core_maths = "0.1"
linked_list_allocator = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
