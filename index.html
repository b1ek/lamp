<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buenos Aires daylight cycle</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000000;
      color: #ffffff;
      font: 400 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      display: grid;
      place-content: center;
    }

    body.idle {
      cursor: none;
    }

    p {
      margin: 0;
      mix-blend-mode: difference;
    }

    #time {
      font-size: 64px;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--text-color);
      width: 500px;
    }

    .page {
      display: flex; flex-direction: row;
      mix-blend-mode: difference;
      gap: 1em;
      justify-content: center;
    }
    .button {
      display: flex; flex-direction: row;
      align-items: center; gap: .5em;
      border: 0; background: transparent;
      font: 400 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text-color);
    }

    #settings {
      color: var(--text-color);
      background: transparent;
      mix-blend-mode: difference;
      flex-direction: column;
    }
    #settings .settingsFields {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <p id="time"></p>

  <div class="pages">
    <div class="page" id="clock">
      <button class="button" id="poweroffButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12q0-2.1.788-3.912t2.137-3.163l1.4 1.4q-1.1 1.1-1.712 2.55T4 12q0 3.35 2.325 5.675T12 20t5.675-2.325T20 12q0-1.675-.612-3.125t-1.713-2.55l1.4-1.4q1.35 1.35 2.138 3.163T22 12q0 2.075-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m-1-9V2h2v11z" />
        </svg>
        <span>Power off</span>
      </button>
    </div>
    <div class="page" id="poweroff" style="display:none">
      <button class="button" id="cancelButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none" />
          <path fill="currentColor" d="m7.825 13l5.6 5.6L12 20l-8-8l8-8l1.425 1.4l-5.6 5.6H20v2z" />
        </svg>
        Cancel
      </button>
      <button class="button" id="yesPoweroffButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12q0-2.1.788-3.912t2.137-3.163l1.4 1.4q-1.1 1.1-1.712 2.55T4 12q0 3.35 2.325 5.675T12 20t5.675-2.325T20 12q0-1.675-.612-3.125t-1.713-2.55l1.4-1.4q1.35 1.35 2.138 3.163T22 12q0 2.075-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m-1-9V2h2v11z" />
        </svg>
        <span>Power off</span>
      </button>
    </div>
    <div class="page" id="poweringoff" style="display:none">
      <button class="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12q0-2.1.788-3.912t2.137-3.163l1.4 1.4q-1.1 1.1-1.712 2.55T4 12q0 3.35 2.325 5.675T12 20t5.675-2.325T20 12q0-1.675-.612-3.125t-1.713-2.55l1.4-1.4q1.35 1.35 2.138 3.163T22 12q0 2.075-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m-1-9V2h2v11z" />
        </svg>
        <span>Powering off</span><pre style="margin:0" id="poweroffanimation">...</pre>
      </button>
    </div>
  </div>

  <script>
    const DAYLIGHT_KELVIN = 6500;
    const NIGHT_COLOR = [0, 0, 0];
    const BUENOS_AIRES = "America/Argentina/Buenos_Aires";
    const SUN_TIMES_URL = "https://api.sunrise-sunset.org/v2?lat=-34.6037&lng=-58.3816";
    const CURSOR_IDLE_DELAY = 5000;

    const NIGHT_TEXT_COLOR = "#111111";
    const DAY_TEXT_COLOR = "#ffffff";

    const delay = t => new Promise(r => setTimeout(r, t));

    let sunriseStart = clockTime(5, 13, 10);
    let sunriseEnd = clockTime(5, 40, 52);
    let sunsetStart = clockTime(19, 35, 30);
    let sunsetEnd = clockTime(20, 3, 16);
    let cursorHideTimer;

    const dayColor = kelvinToRgb(DAYLIGHT_KELVIN);

    const clockFormat = new Intl.DateTimeFormat("en-GB", {
      timeZone: BUENOS_AIRES,
      hourCycle: "h23",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });

    const timeLabel = document.querySelector("#time");

    function clockTime(hours, minutes, seconds) {
      return ((hours * 60 + minutes) * 60 + seconds) * 1000;
    }

    function kelvinToRgb(kelvin) {
      const temperature = kelvin / 100;

      const red = temperature <= 66
        ? 255
        : 329.698727446 * Math.pow(temperature - 60, -0.1332047592);

      const green = temperature <= 66
        ? 99.4708025861 * Math.log(temperature) - 161.1195681661
        : 288.1221695283 * Math.pow(temperature - 60, -0.0755148492);

      const blue = temperature >= 66
        ? 255
        : temperature <= 19
          ? 0
          : 138.5177312231 * Math.log(temperature - 10) - 305.0447927307;

      return [red, green, blue].map(clampChannel);
    }

    function clampChannel(value) {
      return Math.round(Math.min(255, Math.max(0, value)));
    }

    function mix(from, to, amount) {
      return from.map((channel, index) => Math.round(channel + (to[index] - channel) * amount));
    }

    function progress(from, to, current) {
      return (current - from) / (to - from);
    }

    function colorAt(millisecondsIntoDay) {
      if (millisecondsIntoDay < sunriseStart) {
        return NIGHT_COLOR;
      }

      if (millisecondsIntoDay < sunriseEnd) {
        const amount = progress(sunriseStart, sunriseEnd, millisecondsIntoDay);
        return mix(NIGHT_COLOR, dayColor, amount);
      }

      if (millisecondsIntoDay < sunsetStart) {
        return dayColor;
      }

      if (millisecondsIntoDay < sunsetEnd) {
        const amount = progress(sunsetStart, sunsetEnd, millisecondsIntoDay);
        return mix(dayColor, NIGHT_COLOR, amount);
      }

      return NIGHT_COLOR;
    }

    function isNight(millisecondsIntoDay) {
      return millisecondsIntoDay < sunriseStart || millisecondsIntoDay >= sunsetEnd;
    }

    function buenosAiresMillisecondsIntoDay(now) {
      const parts = clockFormat.formatToParts(now);
      const value = (type) => Number(parts.find((part) => part.type === type).value);

      return clockTime(value("hour"), value("minute"), value("second")) + now.getMilliseconds();
    }

    async function loadSunTimes() {
      try {
        const response = await fetch(SUN_TIMES_URL);
        const sunTimes = await response.json();

        sunriseStart = buenosAiresMillisecondsIntoDay(new Date(sunTimes.civil_twilight_begin));
        sunriseEnd = buenosAiresMillisecondsIntoDay(new Date(sunTimes.sunrise));
        sunsetStart = buenosAiresMillisecondsIntoDay(new Date(sunTimes.sunset));
        sunsetEnd = buenosAiresMillisecondsIntoDay(new Date(sunTimes.civil_twilight_end));
      } catch (err) {
        console.error(err);
      }
    }

    function rgbValue(color) {
      return `rgb(${color.join(", ")})`;
    }

    function hideCursor() {
      document.body.classList.add("idle");
    }

    function restartCursorHideTimer() {
      clearTimeout(cursorHideTimer);
      document.body.classList.remove("idle");
      cursorHideTimer = setTimeout(hideCursor, CURSOR_IDLE_DELAY);
    }

    function render() {
      const now = new Date();
      const millisecondsIntoDay = buenosAiresMillisecondsIntoDay(now);
      const color = colorAt(millisecondsIntoDay);

      document.body.style.background = rgbValue(color);
      document.body.style.color = isNight(millisecondsIntoDay) ? NIGHT_TEXT_COLOR : DAY_TEXT_COLOR;
      document.body.style.setProperty('--text-color', isNight(millisecondsIntoDay) ? NIGHT_TEXT_COLOR : DAY_TEXT_COLOR);
      timeLabel.textContent = clockFormat.format(now);

      requestAnimationFrame(render);
    }

    loadSunTimes().then(render);
    window.addEventListener("mousemove", restartCursorHideTimer);
    restartCursorHideTimer();
  </script>

  <script>
      (async () => {
        const poweroffButton = document.getElementById('poweroffButton');
        const yesPoweroffButton = document.getElementById('yesPoweroffButton');
        const cancelButton = document.getElementById('cancelButton');

        const clock = document.getElementById('clock');
        const poweroff = document.getElementById('poweroff');
        const poweringoff = document.getElementById('poweringoff');
        let activePage = clock;

        let lock = false;

        async function setActivePage(newActive) {
          if (lock) throw new Error('cannot set active page while its being refreshed');
          lock = true;

          activePage.style.display = 'none';
          newActive.style.removeProperty('display');

          activePage = newActive;
          lock = false;
        }

        poweroffButton.onclick = async () => {
          await setActivePage(poweroff);
        }
        cancelButton.onclick = async () => {
          await setActivePage(clock);
        }
        yesPoweroffButton.onclick = async () => {
          await setActivePage(poweringoff);
          
          const anim = document.getElementById('poweroffanimation');
          let i = 0;
          async function poweroffAnimRender() {
            anim.innerText = '.'.repeat(i).padEnd(4, ' ');
            i += 1;
            if (i == 4) i = 0;
            await delay(500);
            requestAnimationFrame(poweroffAnimRender);
          }
          poweroffAnimRender();
        }
      })();
  </script>
</body>
</html>
